<body>
  <div id="stage"></div>
  <div id="hud" hidden>
    <div id="hearts"></div>
    <div id="score"></div>
    <div id="wave"></div>
    <div id="bossbar" hidden><span>Zombie King</span><div><i></i></div></div>
    <div id="sound"></div>
    <div id="weapons"><span id="weapon-popper"></span> · <span id="weapon-scattergun"></span> · <span id="weapon-launcher"></span> · <span id="weapon-gatling"></span></div>
    <div id="notice" hidden></div>
    <div id="hint" hidden></div>
  </div>
  <div id="crosshair" hidden></div>
  <div id="band" hidden>
    <h1></h1>
    <div class="lines"></div>
    <div class="buttons">
      <button type="button" hidden></button>
      <button type="button" hidden></button>
    </div>
  </div>
